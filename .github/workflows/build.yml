name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native desktop app
        shell: powershell
        run: .\build.ps1
      - name: Run parser regression checks
        shell: powershell
        run: |
          $check = Start-Process -FilePath .\dist\CodexUsage.exe -ArgumentList --self-test -Wait -PassThru
          Get-Content .\dist\self-test.txt
          if ($check.ExitCode -ne 0) { throw 'Regression checks failed' }
      - name: Package portable application
        shell: powershell
        run: Compress-Archive -Path dist\CodexUsage.exe,README.md,LICENSE,assets -DestinationPath CodexUsage-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsage-Windows
          path: CodexUsage-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CodexUsage-Windows
      - name: Publish portable Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" CodexUsage-Windows.zip --verify-tag --title "Codex Usage Desktop $RELEASE_TAG" --notes-file .github/release-notes.md
